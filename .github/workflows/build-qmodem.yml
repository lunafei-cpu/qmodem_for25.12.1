name: Build QModem for ImmortalWrt 25.12.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Checkout ImmortalWrt v25.12.1
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: v25.12.1
          fetch-depth: 1

      - name: Add QModem feed
        run: |
          echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Defconfig
        run: make defconfig

      - name: Compile qmodem
        run: make package/qmodem/compile V=s -j$(nproc)

      - name: Compile luci-app-qmodem-next
        run: make package/luci-app-qmodem-next/compile V=s -j$(nproc)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: qmodem-apks
          path: |
            bin/packages/x86_64/*/qmodem*.apk
            bin/packages/x86_64/*/luci-app-qmodem-next*.apk
