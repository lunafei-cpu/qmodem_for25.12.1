name: Build QModem for ImmortalWrt 25.12.1

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构 (如 x86_64, mediatek_filogic, armsr_armv8)'
        required: true
        default: 'x86_64' # 注意：根据你之前的日志，如果是红米AX6000等路由器，请改成 mediatek_filogic

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 安装系统编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libtool autoconf automake pkg-config

      - name: 2. 拉取 ImmortalWrt v25.12.1 源码
        uses: actions/checkout@v5
        with:
          repository: immortalwrt/immortalwrt
          ref: v25.12.1
          fetch-depth: 1

      - name: 3. 添加 QModem Feed
        run: echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default

      - name: 4. 更新 Feeds
        run: ./scripts/feeds update -a

      - name: 5. 安装 Feeds
        run: ./scripts/feeds install -a

      - name: 6. 默认配置
        run: make defconfig

      - name: 7. 预先选择 QModem 包
        run: |
          echo 'CONFIG_PACKAGE_qmodem=m' >> .config
          echo 'CONFIG_PACKAGE_luci-app-qmodem-next=m' >> .config
          make defconfig

      - name: 8. 编译基础工具链 (修复 host openssl 缺失)
        run: make tools/compile -j$(nproc)

      - name: 9. 编译 libopenssl (确保依赖完整)
        run: make package/libs/openssl/compile -j$(nproc)

      - name: 10. 编译 QModem (单线程排错)
        run: make package/qmodem/compile V=s -j1

      - name: 11. 编译 luci-app-qmodem-next (单线程排错)
        run: make package/luci-app-qmodem-next/compile V=s -j1

      - name: 12. 上传编译好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: qmodem-apks
          path: |
            bin/packages/**/qmodem*.apk
            bin/packages/**/luci-app-qmodem-next*.apk
