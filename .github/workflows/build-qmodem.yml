name: Build QModem for ImmortalWrt 25.12.1

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构 (如 x86_64, armsr-armv8, mediatek-filogic)'
        required: true
        default: 'mediatek-filogic' # 已根据你的日志改为 filogic

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_TAG: v25.12.1
  QMODEM_FEED: https://github.com/FUjr/QModem.git;main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 安装系统编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget libtool autoconf automake

      - name: 2. 拉取 ImmortalWrt v25.12.1 源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_URL }}
          ref: ${{ env.REPO_TAG }}
          fetch-depth: 1

      - name: 3. 添加 QModem Feed
        run: echo 'src-git qmodem ${{ env.QMODEM_FEED }}' >> feeds.conf.default

      - name: 4. 更新 Feeds
        run: ./scripts/feeds update -a

      - name: 5. 安装 Feeds
        run: ./scripts/feeds install -a

      - name: 6. 默认配置
        run: make defconfig

      - name: 7. 预先选择 QModem 包
        run: |
          echo 'CONFIG_PACKAGE_qmodem=m' >> .config
          echo 'CONFIG_PACKAGE_luci-app-qmodem-next=m' >> .config
          make defconfig

      - name: 8. 编译基础工具链 (修复 host openssl 缺失)
        run: make tools/compile toolchain/install -j$(nproc)

      - name: 9. 编译 libopenssl (确保依赖完整)
        run: make package/libs/openssl/compile -j$(nproc)

      - name: 10. 编译 QModem (单线程排错)
        run: make package/qmodem/compile V=s -j1

      - name: 11. 编译 luci-app-qmodem-next (单线程排错)
        run: make package/luci-app-qmodem-next/compile V=s -j1

      - name: 12. 上传编译好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: qmodem-apks
          path: |
            bin/packages/**/qmodem*.apk
            bin/packages/**/luci-app-qmodem-next*.apk
