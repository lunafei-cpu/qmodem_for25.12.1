name: Build QModem for ImmortalWrt 25.12.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 安装系统编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libtool autoconf automake pkg-config

      - name: 2. 拉取 ImmortalWrt v25.12.1 源码
        uses: actions/checkout@v5
        with:
          repository: immortalwrt/immortalwrt
          ref: v25.12.1
          fetch-depth: 1

      - name: 3. 添加 QModem Feed
        run: echo 'src-git qmodem https://github.com/FUjr/QModem.git;main' >> feeds.conf.default

      - name: 4. 更新 Feeds
        run: ./scripts/feeds update -a

      - name: 5. 安装 Feeds
        run: ./scripts/feeds install -a

      - name: 6. 默认配置
        run: make defconfig

      - name: 7. 预先选择 QModem 包
        run: |
          echo 'CONFIG_PACKAGE_qmodem=m' >> .config
          echo 'CONFIG_PACKAGE_luci-app-qmodem-next=m' >> .config
          make defconfig

      - name: 8. 修补 QModem ABI 依赖版本 (关键修复)
        run: |
          # 将 QModem 中所有高版本 ABI 引用替换为 v25.12.1 源码树中的版本
          # 涉及: 20260708/20260503/20260628 -> 20260213
          for f in $(find package/feeds/qmodem -name Makefile); do
            echo "正在修补: $f"
            sed -i 's/20260708/20260213/g' "$f"
            sed -i 's/20260503/20260213/g' "$f"
            sed -i 's/20260628/20260213/g' "$f"
          done
          # 检查修补结果
          echo "=== 修补后的依赖声明 ==="
          grep -r "DEPENDS" package/feeds/qmodem/ | grep "libu"

      - name: 9. 编译基础工具链
        run: make tools/compile -j$(nproc)

      - name: 10. 编译 libopenssl
        run: make package/libs/openssl/compile -j$(nproc)

      - name: 11. 编译 QModem
        run: make package/qmodem/compile V=s -j1

      - name: 12. 编译 luci-app-qmodem-next
        run: make package/luci-app-qmodem-next/compile V=s -j1

      - name: 13. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: qmodem-apks
          path: |
            bin/packages/**/qmodem*.apk
            bin/packages/**/luci-app-qmodem-next*.apk
